<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			try {
				document.documentElement.dataset.theme = 'dark';
			} catch {}
		</script>
		<script>
			try {
				const [nav] = performance.getEntriesByType('navigation');
				const own = new URL(document.referrer).origin === location.origin;
				if (nav && (nav.type === 'back_forward' || (nav.type === 'navigate' && own)))
					document.documentElement.dataset.noLoader = '';
			} catch {}
		</script>
		<script>
			try {
				if (sessionStorage.getItem('page-cover')) {
					sessionStorage.removeItem('page-cover');
					if (!matchMedia('(prefers-reduced-motion: reduce)').matches)
						document.documentElement.dataset.covered = '';
				}
			} catch {}
		</script>
		<style>
			html[data-covered]::after {
				content: '';
				position: fixed;
				inset: 0;
				z-index: 100;
				background: #1a1a1a;
				animation: cover-failsafe 0.3s ease 5s forwards;
			}
			@keyframes cover-failsafe {
				to {
					visibility: hidden;
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
